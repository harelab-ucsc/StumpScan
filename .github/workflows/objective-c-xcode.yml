name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyze
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch opencv2.xcframework via CocoaPods
        run: |
          pod install
          # pod install rewrites project.pbxproj to add CocoaPods integration;
          # restore our hand-crafted version that links the xcframework directly.
          git checkout StumpScan.xcodeproj/project.pbxproj

      - name: Patch xcframework to iOS shallow bundle layout
        run: |
          FW_BASE="Pods/OpenCV-Dynamic-Framework/opencv2.xcframework"
          for SLICE in ios-arm64 ios-arm64_x86_64-simulator; do
            FW="${FW_BASE}/${SLICE}/opencv2.framework"
            cp "${FW}/Resources/Info.plist" "${FW}/Info.plist"
            plutil -insert CFBundleExecutable -string opencv2 "${FW}/Info.plist" 2>/dev/null || true
            rm -rf "${FW}/Versions" "${FW}/Resources"
          done

      - name: Build
        run: |
          xcodebuild clean build analyze \
            -project StumpScan.xcodeproj \
            -scheme StumpScan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=YES \
            | xcpretty && exit ${PIPESTATUS[0]}
